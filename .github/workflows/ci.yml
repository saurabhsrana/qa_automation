# Loyalty test automation CI
#
# Triggers:
#   - Push to main/master → full regression suite (lint + E2E + Allure + Pages)
#   - Push to develop → smoke only (@smoke)
#   - Pull request → Lint & typecheck always; E2E smoke only with ready-for-e2e label
#   - Manual run: GitHub → Actions → CI → Run workflow
#     Inputs: environment (qa | uat, default uat), tag (e.g. @smoke), enable_video
#     Pages deploys on main/master for push and workflow_dispatch
#     Last N reports on the gh-pages branch under /reports/<run>-<sha>/ (REPORTS_TO_KEEP)
#
# E2E tests hit a shared QA/UAT environment (default TEST_ENV=uat), so on PRs they
# are gated behind the ready-for-e2e label to avoid multiple PRs colliding on
# shared test data. Add the label on the PR sidebar to trigger E2E; new commits
# (synchronize) on an already-labeled PR re-run E2E automatically. Removing the
# label skips E2E on the next unlabeled/synchronize evaluation.
#
# Targets from src/config/environments/{qa,uat}.config.ts — baseUrl and otp.
#
# One-time GitHub Pages setup (for browsable Allure report):
#   Settings → Pages → Build and deployment → Source: Deploy from a branch → gh-pages / (root)
#
# After a run:
#   - Playwright UI (chromium) → Summary + artifacts
#   - publish-allure → Allure report from chromium results, then GitHub Pages URL
#     (Pages: gh-pages branch, main/master push or manual run; develop never publishes)
#   - Manual "Run workflow" can set enable_video=true (sets PW_VIDEO=on) when motion matters
#
# Artifact retention: keep upload-artifact retention-days in sync (default 14 below).

name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options:
          - uat
          - qa
        default: uat
      tag:
        description: Playwright tag (e.g. @smoke or @regression). Leave empty or type any for the full suite.
        type: string
        default: ''
      enable_video:
        description: Record video on failure (larger artifacts; for animation/drag-drop debugging)
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REPORTS_TO_KEEP: 5

jobs:
  static-checks:
    name: Lint & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Prettier check
        run: npm run format:check

  playwright-ui:
    name: Playwright UI
    needs: static-checks
    # Push / workflow_dispatch: always run E2E after lint.
    # pull_request: only when the PR has the ready-for-e2e label (skipped otherwise → neutral check).
    if: >-
      github.event_name == 'push'
      || github.event_name == 'workflow_dispatch'
      || (github.event_name == 'pull_request'
          && contains(github.event.pull_request.labels.*.name, 'ready-for-e2e'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: Install Playwright browser (chromium)
        run: npx playwright install --with-deps chromium

      - name: Reset Allure folders
        run: npm run allure:clean

      - name: Resolve environment and tag
        id: target
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref }}
          MANUAL_ENV: ${{ inputs.environment }}
          MANUAL_TAG: ${{ inputs.tag }}
        run: |
          ENV="uat"
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -n "$MANUAL_ENV" ]; then
            ENV="$MANUAL_ENV"
          fi
          case "$ENV" in
            qa|uat) ;;
            *)
              echo "Unsupported environment: $ENV (use qa or uat)"
              exit 1
              ;;
          esac

          FILTER=""
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$(printf '%s' "$MANUAL_TAG" | tr '[:upper:]' '[:lower:]' | xargs)"
            case "$TAG" in
              ""|any|all|"*") FILTER="" ;;
              @*) FILTER="$TAG" ;;
              *) FILTER="@$TAG" ;;
            esac
          elif [ "$EVENT_NAME" = "pull_request" ]; then
            FILTER="@smoke"
          elif [ "$REF_NAME" = "refs/heads/develop" ]; then
            FILTER="@smoke"
          fi

          {
            echo "test_env=$ENV"
            echo "filter=$FILTER"
          } >> "$GITHUB_OUTPUT"
          echo "TEST_ENV=$ENV" >> "$GITHUB_ENV"
          {
            echo "## Run target"
            echo ""
            echo "- Event: \`$EVENT_NAME\`"
            echo "- Environment: \`$ENV\` → \`src/config/environments/${ENV}.config.ts\`"
            echo "- Tag / grep: \`${FILTER:-<all tests>}\`"
            echo "- Browser: \`chromium\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Playwright UI (--project=chromium)
        id: playwright
        continue-on-error: true
        env:
          CI: true
          HEADLESS: 'true'
          TEST_ENV: ${{ steps.target.outputs.test_env }}
          BROWSER: chromium
          PARALLEL_WORKERS: '1'
          # Enrollment tests (completeprofile) toggle FEATURE_AUTOMATION_ENABLED via Convex CLI.
          # convexFeatureFlag.ts maps TEST_ENV → CONVEX_DEPLOY_KEY_QA / CONVEX_DEPLOY_KEY_UAT
          # (must match convexDeployment in the active env config).
          CONVEX_DEPLOY_KEY_QA: ${{ secrets.CONVEX_DEPLOY_KEY_QA }}
          CONVEX_DEPLOY_KEY_UAT: ${{ secrets.CONVEX_DEPLOY_KEY_UAT }}
          # Verified 2026-09-07: QA and UAT share one Vercel project — one bypass secret.
          VERCEL_PROTECTION_BYPASS_KEY: ${{ secrets.VERCEL_PROTECTION_BYPASS_KEY }}
          # push/PR: inputs.enable_video is unset → off. Manual run: enable_video checkbox.
          PW_VIDEO: ${{ inputs.enable_video == true && 'on' || 'off' }}
          PW_GREP: ${{ steps.target.outputs.filter }}
        run: |
          set -o pipefail
          GREP_ARGS=()
          if [ -n "$PW_GREP" ]; then
            GREP_ARGS=(--grep "$PW_GREP")
          fi
          {
            echo "### Playwright --list"
            npx playwright test --project=chromium --list "${GREP_ARGS[@]}" || true
            echo ""
            echo "### Playwright run"
            npx playwright test --project=chromium --retries=1 "${GREP_ARGS[@]}"
          } 2>&1 | tee playwright-ci.log
          status=${PIPESTATUS[0]}
          {
            echo "## Playwright console (tail) — chromium"
            echo ""
            echo '```'
            tail -n 80 playwright-ci.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Surface Playwright last-run into Job Summary
        if: always()
        run: |
          {
            echo "## Playwright last-run (chromium)"
            echo ""
            if [ -f test-results/.last-run.json ]; then
              echo '```json'
              cat test-results/.last-run.json
              echo '```'
            else
              echo "_No test-results/.last-run.json (Playwright may have failed before writing results)._"
            fi
            echo ""
            echo "### Spec files present"
            echo ""
            ls -la tests/ui || true
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Generate Allure report (artifact only)
        if: always()
        run: npm run allure:generate
        continue-on-error: true

      - name: GitHub Job Summary
        if: always()
        env:
          BROWSER: chromium
        run: npm run ci:summary

      - name: Upload Allure raw results (chromium)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-chromium
          path: reports/allure-results/
          retention-days: 14
          if-no-files-found: warn

      - name: Upload Playwright failure artifacts (chromium)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-ui-chromium-artifacts
          path: |
            reports/allure-report/
            reports/traces/
            reports/screenshots/
            reports/logs/
            test-results/
            playwright-ci.log
          retention-days: 14
          if-no-files-found: warn

      - name: Fail job if Playwright failed
        if: steps.playwright.outcome == 'failure'
        run: exit 1

  combine-allure:
    name: Combine Allure report
    needs: playwright-ui
    # always(): still generate when Playwright UI fails so the report includes failures.
    # Skip when Playwright was skipped (no ready-for-e2e on PR, lint failed, or cancelled).
    if: always() && (needs.playwright-ui.result == 'success' || needs.playwright-ui.result == 'failure')
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: Restore Allure trend history
        uses: actions/cache@v4
        with:
          path: reports/allure-history
          # Stable key per branch so Trend charts persist across CI runs.
          key: allure-history-${{ github.ref_name }}-${{ inputs.environment || 'uat' }}
          restore-keys: |
            allure-history-

      - name: Download Chromium Allure results
        uses: actions/download-artifact@v4
        with:
          name: allure-results-chromium
          path: allure-inbox

      - name: Generate Allure report
        env:
          ALLURE_BROWSERS: chromium
          ALLURE_OS: ${{ runner.os }}
          TEST_ENV: ${{ inputs.environment || 'uat' }}
          ALLURE_REPORT_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/latest/
        run: |
          set -euo pipefail
          export ALLURE_NODE="$(node -v)"
          mkdir -p reports/allure-results reports/allure-history
          if [ -d allure-inbox ]; then
            find allure-inbox -type f -print0 | while IFS= read -r -d '' f; do
              cp -n "$f" "reports/allure-results/$(basename "$f")" 2>/dev/null || \
                cp "$f" "reports/allure-results/$(basename "$f").${RANDOM}"
            done
          fi
          echo "Merged Allure result files:"
          ls -la reports/allure-results | head -n 50
          # Writes executor.json, environment.properties, categories.json; ensures history.jsonl exists.
          # allure:generate also runs prepare, then allure generate (reads allurerc historyPath + categories).
          npm run allure:generate
          test -f reports/allure-report/index.html
          echo "History file after generate:"
          ls -la reports/allure-history || true
          wc -l reports/allure-history/history.jsonl || true

      - name: Upload combined Allure report artifact
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-combined
          path: reports/allure-report/
          retention-days: 14
          if-no-files-found: error

      - name: Upload Allure history snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-history-jsonl
          path: reports/allure-history/
          retention-days: 14
          if-no-files-found: warn

  # Always runs after combine (including on PRs) so the last visible job is not a grey "skipped" Pages deploy.
  publish-allure:
    name: Publish Allure report
    needs: combine-allure
    # always(): run whenever combine produced a report (even if UI tests failed).
    if: always() && needs.combine-allure.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: write
    steps:
      - name: Confirm combined report artifact
        uses: actions/download-artifact@v4
        with:
          name: allure-report-combined
          path: allure-report

      - name: Write report location to Job Summary
        env:
          EVENT_NAME: ${{ github.event_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          IS_PAGES_DEPLOY: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') }}
        run: |
          {
            echo "## Allure report"
            echo ""
            echo "**Artifact:** \`allure-report-combined\` (contains \`index.html\`)"
            echo ""
            echo "Download: [Run artifacts]($RUN_URL#artifacts)"
            echo ""
            if [ "$IS_PAGES_DEPLOY" = "true" ]; then
              echo "GitHub Pages deploy runs next (main/master push or manual Run workflow)."
              echo ""
              echo "Catalog: [https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/](https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/)"
              echo ""
              echo "Latest Allure: [https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/latest/](https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/latest/)"
              echo ""
              echo "If Pages is not enabled yet: **Settings → Pages → Source: Deploy from a branch → gh-pages / (root)**, then re-run CI."
            else
              echo "Pages deploy skipped (not a main/master push or manual run) — see the **allure-report-combined** build artifact above."
              echo ""
              echo "After download: unzip and open \`index.html\` in a browser."
              echo ""
              echo "Also available: \`allure-results-chromium\` and \`playwright-ui-chromium-artifacts\`."
            fi
            echo ""
            echo "### Files in artifact"
            echo ""
            echo '```'
            find allure-report -maxdepth 2 -type f | head -n 30
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comment report link on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              '## Allure report (PR)',
              '',
              'GitHub Pages deploy is **skipped on pull requests** (environment protection allows `main` only).',
              '',
              `1. Open [this run’s Artifacts](${runUrl}#artifacts)`,
              '2. Download **`allure-report-combined`**',
              '3. Unzip and open **`index.html`**',
              '',
              '_Also available: `allure-results-chromium` and `playwright-ui-chromium-artifacts`._',
            ].join('\n');
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const marker = '## Allure report (PR)';
            const existing = comments.find((c) => c.user?.type === 'Bot' && c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  publish-allure-pages:
    name: Publish Allure (GitHub Pages)
    needs: [playwright-ui, combine-allure, publish-allure]
    # always() is required: without it, GitHub skips this job when any upstream
    # dependency chain includes a failed Playwright UI job — even if combine/publish succeeded.
    # main/master only: push or manual Run workflow (never PR / develop).
    if: >-
      always()
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
      && needs.combine-allure.result == 'success'
    runs-on: ubuntu-latest
    # Restores the clickable URL on the workflow graph (same as actions/deploy-pages).
    environment:
      name: github-pages
      url: ${{ steps.urls.outputs.latest_url }}
    outputs:
      latest_url: ${{ steps.urls.outputs.latest_url }}
      catalog_url: ${{ steps.urls.outputs.catalog_url }}
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout default branch (scripts)
        uses: actions/checkout@v4

      - name: Checkout gh-pages (keep existing report folders)
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages
          fetch-depth: 0

      - name: Ensure gh-pages working tree
        run: mkdir -p gh-pages

      - name: Download combined Allure report
        uses: actions/download-artifact@v4
        with:
          name: allure-report-combined
          path: artifact

      - name: Add this run, prune to last N, write catalog
        id: site
        env:
          GH_PAGES_DIR: gh-pages
          ALLURE_REPORT_DIR: artifact
          REPORT_STATUS: ${{ needs.playwright-ui.result }}
          REPORT_TIMESTAMP: ${{ github.event.head_commit.timestamp || github.event.repository.updated_at }}
        run: |
          if [ -z "$REPORT_TIMESTAMP" ]; then
            REPORT_TIMESTAMP="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            export REPORT_TIMESTAMP
          fi
          node .github/scripts/update-allure-gh-pages.js

      - name: Resolve Allure Pages URLs
        id: urls
        env:
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          FOLDER: ${{ steps.site.outputs.folder }}
        run: |
          OWNER_LC="$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')"
          BASE="https://${OWNER_LC}.github.io/${REPO}"
          {
            echo "pages_base=${BASE}"
            echo "catalog_url=${BASE}/"
            echo "latest_url=${BASE}/latest/"
            echo "run_url=${BASE}/reports/${FOLDER}/"
          } >> "$GITHUB_OUTPUT"

      - name: Drop nested .git before publish
        run: rm -rf gh-pages/.git

      - name: Publish gh-pages branch
        id: deployment
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./gh-pages
          publish_branch: gh-pages
          # Full assembled tree (script already kept last N). force_orphan: false
          # preserves commit history on gh-pages; do not use keep_files here or
          # pruned /reports folders would come back.
          force_orphan: false
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
          commit_message: "Allure ${{ github.run_number }}-${{ github.sha }}"

      - name: Allure report URL
        if: always()
        env:
          DEPLOY_OUTCOME: ${{ steps.deployment.outcome }}
          CATALOG_URL: ${{ steps.urls.outputs.catalog_url }}
          LATEST_URL: ${{ steps.urls.outputs.latest_url }}
          THIS_RUN_URL: ${{ steps.urls.outputs.run_url }}
          KEPT: ${{ steps.site.outputs.kept }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "## Allure report"
            echo ""
            if [ "$DEPLOY_OUTCOME" = "success" ] && [ -n "$LATEST_URL" ]; then
              echo "**Latest Allure:** [${LATEST_URL}](${LATEST_URL})"
              echo ""
              echo "- **Catalog (last ${{ env.REPORTS_TO_KEEP }}):** [${CATALOG_URL}](${CATALOG_URL})"
              echo "- **This run:** [${THIS_RUN_URL}](${THIS_RUN_URL})"
              echo "- Kept folders: \`${KEPT}\`"
            else
              echo "gh-pages push did not succeed (outcome: \`${DEPLOY_OUTCOME:-unknown}\`)."
              echo ""
              echo "### One-time setup"
              echo "1. Open [Settings → Pages](https://github.com/${{ github.repository }}/settings/pages)"
              echo "2. **Source:** Deploy from a branch → \`gh-pages\` / \`/\` (root)"
              echo "3. Allow Actions to write (\`GITHUB_TOKEN\` contents: write is set on this job)"
              echo ""
              echo "### Report available now (artifact)"
              echo "Download [\`allure-report-combined\`]($RUN_URL#artifacts), unzip, and open \`index.html\`."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$DEPLOY_OUTCOME" = "success" ] && [ -n "$LATEST_URL" ]; then
            echo "::notice title=Allure report::${LATEST_URL}"
          fi
