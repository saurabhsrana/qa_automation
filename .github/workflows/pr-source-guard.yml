# Required status check name (add this on main branch protection):
#   PR source must be develop
#
# Fails any PR into main/master whose head branch is not develop.
# Feature work must land on develop first; main only accepts release PRs.

name: PR source guard

on:
  pull_request:
    branches: [main, master]

jobs:
  require-develop:
    name: PR source must be develop
    runs-on: ubuntu-latest
    steps:
      - name: Check source branch
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          echo "PR ${BASE_REF} ← ${HEAD_REF}"
          if [ "$HEAD_REF" != "develop" ]; then
            echo "::error::PRs targeting main must come from develop (got '${HEAD_REF}'). Open feature/* PRs against develop instead. See CONTRIBUTING.md."
            exit 1
          fi
          echo "Source branch is develop — allowed."
